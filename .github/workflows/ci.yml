name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Debug APK (GitHub)
        run: ./gradlew :app:assembleDebug

      - name: Verify Myket Manifest Strip
        run: |
          ./gradlew :app:processDebugManifest -PdistributionChannel=myket
          MANIFEST="app/build/intermediates/merged_manifest/debug/stripInstallPermissionDebug/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Expected Myket merged manifest not found at $MANIFEST"
            exit 1
          fi
          if grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            echo "ERROR: REQUEST_INSTALL_PACKAGES present in Myket manifest!"
            exit 1
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Lint
        run: ./gradlew :app:lintDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
