name: Build and release APK

on:
  push:
    tags: ["v*"]
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: versioning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags || true
          
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.3.0"
            fi
            
            TAG_NO_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NO_V"
            NEW_PATCH=$((PATCH + 1))
            TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Automated version bump to $TAG_NAME" || true
            git push origin "$TAG_NAME" || true
          fi
          
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=${TAG_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
          GIT_TAG: ${{ steps.versioning.outputs.TAG_NAME }}
        run: gradle :app:assembleRelease

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --verbose app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk "LogaRhythm-${{ steps.versioning.outputs.TAG_NAME }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: LogaRhythm-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          files: LogaRhythm-*.apk
          generate_release_notes: true
