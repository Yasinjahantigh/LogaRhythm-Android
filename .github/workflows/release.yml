name: Build and release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.4.0 or v1.4.0). Leave empty to increment the patch version."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: versioning
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force || true

          if [ -n "${INPUT_VERSION}" ]; then
            TAG_NAME="v${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v1.3.1"
            fi
            TAG_NO_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NO_V"
            NEW_PATCH=$((PATCH + 1))
            TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${TAG_NAME}"

      - name: Create and push tag
        if: github.ref_type != 'tag'
        env:
          TAG_NAME: ${{ steps.versioning.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            echo "Tag ${TAG_NAME} already exists, skipping creation."
          else
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
          GIT_TAG: ${{ steps.versioning.outputs.TAG_NAME }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signature
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner verify --verbose app/build/outputs/apk/release/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk "LogaRhythm-${{ steps.versioning.outputs.TAG_NAME }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.versioning.outputs.TAG_NAME }}
          path: LogaRhythm-*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          files: LogaRhythm-*.apk
          generate_release_notes: true

      - name: Generate changelog with Gemma
        id: changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG_NAME: ${{ steps.versioning.outputs.TAG_NAME }}
        run: |
          set -euo pipefail

          PREV_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 2 | head -n 1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG_NAME" ]; then
            COMMITS="اولین نسخه"
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" \
              | grep -v -E "^- (docs|ci|chore|build|style|test):" \
              | head -20)
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="بهبودهای کلی و رفع مشکلات"
          fi

          PROMPT="کامیت‌های زیر تغییرات نسخه جدید نرم‌افزار LogaRhythm هستند (یک پخش‌کننده موسیقی اندرویدی). آن‌ها را به فارسی روان و کاربرپسند تبدیل کن. هر تغییر یک خط با بولت • باشد. حداکثر ۵ مورد. فقط تغییرات را بنویس بدون هیچ توضیح اضافه:\n\n${COMMITS}"

          RESPONSE=$(curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models/gemma-3-27b-it:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"contents\":[{\"parts\":[{\"text\":$(echo "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}]}]}")

          CHANGELOG=$(echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          try:
              print(data['candidates'][0]['content']['parts'][0]['text'].strip())
          except:
              print('بهبودهای کلی و رفع مشکلات')
          ")

          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TAG_NAME: ${{ steps.versioning.outputs.TAG_NAME }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          set -euo pipefail

          MESSAGE="🎵 LogaRhythm ${TAG_NAME}

تغییرات این نسخه:
${CHANGELOG}

📥 دانلود از گیت‌هاب:
https://github.com/Yasinjahantigh/LogaRhythm-Android/releases/tag/${TAG_NAME}

💬 باگ یا پیشنهاد؟ همین پایین کامنت بذارید."

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHANNEL_ID}" \
            -F "document=@LogaRhythm-${TAG_NAME}.apk" \
            -F "caption=${MESSAGE}" \
            -F "parse_mode=HTML"
