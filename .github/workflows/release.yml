name: Build and release APK

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 2.2.0 or v2.2.0). Leave empty to increment the patch version."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: versioning
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force || true

          if [ -n "${INPUT_VERSION}" ]; then
            TAG_NAME="v${INPUT_VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
            if [ -z "$LATEST_TAG" ]; then
              LATEST_TAG="v2.2.0"
            fi
            TAG_NO_V=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_NO_V"
            NEW_PATCH=$((PATCH + 1))
            TAG_NAME="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          fi

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${TAG_NAME}"

      - name: Create and push tag
        if: github.ref_type != 'tag'
        env:
          TAG_NAME: ${{ steps.versioning.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" > /dev/null; then
            echo "Tag ${TAG_NAME} already exists, skipping creation."
          else
            git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
            git push origin "${TAG_NAME}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi

      - name: Build GitHub Release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
          GIT_TAG: ${{ steps.versioning.outputs.TAG_NAME }}
          INSTALL_ENDPOINT: ${{ vars.INSTALL_ENDPOINT }}
        run: ./gradlew :app:assembleRelease -PdistributionChannel=github

      - name: Verify & Collect GitHub APKs
        run: |
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          TAG="${{ steps.versioning.outputs.TAG_NAME }}"
          mkdir -p release-out
          shopt -s nullglob
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $apk"
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$apk"
            base=$(basename "$apk" .apk)
            abi=${base#app-}
            abi=${abi%-unsigned}
            abi=${abi%-release}
            cp "$apk" "release-out/LogaRhythm-$TAG-$abi.apk"
          done

      - name: Build Myket Universal Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
          GIT_TAG: ${{ steps.versioning.outputs.TAG_NAME }}
          INSTALL_ENDPOINT: ${{ vars.INSTALL_ENDPOINT }}
        run: |
          ./gradlew :app:assembleRelease -PdistributionChannel=myket
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          MANIFEST="app/build/intermediates/merged_manifest/release/stripInstallPermissionRelease/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: Expected Myket merged manifest not found at $MANIFEST"
            exit 1
          fi
          if grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            echo "ERROR: REQUEST_INSTALL_PACKAGES leaked into Myket release manifest!"
            exit 1
          fi
          TAG="${{ steps.versioning.outputs.TAG_NAME }}"
          UNI="app/build/outputs/apk/release/app-universal-release.apk"
          if [ -f "$UNI" ]; then
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$UNI"
            mkdir -p release-out/myket
            cp "$UNI" "release-out/myket/LogaRhythm-$TAG-myket-universal.apk"
          fi

      - name: Prepare Release Notes
        run: |
          TAG="${{ steps.versioning.outputs.TAG_NAME }}"
          if [ -f "docs/releases/${TAG}.md" ]; then
            cp "docs/releases/${TAG}.md" "release-out/release-notes.md"
          else
            echo "LogaRhythm ${TAG} — See CHANGELOG.md for the full list of changes." > "release-out/release-notes.md"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.versioning.outputs.TAG_NAME }}
          path: release-out/**

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          files: release-out/LogaRhythm-*.apk
          body_path: release-out/release-notes.md
          generate_release_notes: true

      - name: Post to Telegram
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHANNEL_ID != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TAG_NAME: ${{ steps.versioning.outputs.TAG_NAME }}
        run: |
          cp release-out/LogaRhythm-*.apk .
          python3 .github/scripts/telegram_release.py
